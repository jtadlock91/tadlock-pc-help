[package]
name = "tadlock-pc-help"
version = "0.1.0"
edition = "2021"
description = "pcrepair.tadlockfamily.net rebuilt in Rust (learning project)"

[dependencies]
# axum: the web framework. Thin layer over hyper (the HTTP implementation)
# and tower (the middleware/service abstraction). We interact with axum;
# it delegates the hard parts downward.
axum = "0.8"

# tokio: the async runtime. Rust ships async *syntax* but no runtime —
# something has to actually poll futures and drive the event loop.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }

# askama: compile-time HTML templates.
askama = "0.14"

# tracing: structured, leveled logging. Unlike println!, output carries a
# level (info/warn/error/debug) and timestamps, and verbosity is
# controllable at runtime via the RUST_LOG env var — no recompile needed.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# tower-http's TraceLayer: middleware that logs every request automatically
# (method, path, status, latency) by wrapping the whole router — the
# handler itself never has to know logging exists.
tower-http = { version = "0.6", features = ["trace"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
